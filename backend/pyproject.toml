[project]
name = "mental-math"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "argon2-cffi>=23,<26",
  "email-validator>=2.2,<3",
  "uuid6>=2024.7.10,<2026",
]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
