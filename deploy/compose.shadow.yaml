# Shadow policy overlay: record Framework System One proposals while rules keep deciding.
# The bearer token is mounted from a host file (never an environment variable or a repository file).
services:
  api:
    environment:
      MMATH_POLICY_MODE: shadow
      MMATH_FRAMEWORK_URL: ${MMATH_FRAMEWORK_URL:?Set the Framework GPU Tools base URL}
      MMATH_FRAMEWORK_MODEL: ${MMATH_FRAMEWORK_MODEL:-laya-auto}
      MMATH_FRAMEWORK_TOKEN_FILE: /run/secrets/framework_edge_token
    secrets:
      - framework_edge_token
secrets:
  framework_edge_token:
    file: ${MMATH_FRAMEWORK_TOKEN_PATH:?Set the host path of the Framework edge token file}
