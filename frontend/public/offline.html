<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Считай легко</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #faf6ec; color: #243247; }
      main { max-width: 520px; margin: 12vh auto; padding: 24px; }
      h1 { font-size: 2rem; margin: 0 0 12px; }
      button { min-height: 48px; padding: 10px 18px; border: 0; border-radius: 12px; background: #126d67; color: #fff; font: inherit; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1 data-ru="Нужно подключение" data-en="Connection required"></h1>
      <p data-ru="Занятия проходят только с подключением к интернету. Ответы и прогресс хранятся на сервере, ничего не теряется. Подключитесь и попробуйте снова." data-en="Practice needs an internet connection. Answers and progress live on the server, so nothing is lost. Connect and try again."></p>
      <button data-ru="Повторить" data-en="Retry" onclick="location.reload()"></button>
    </main>
    <script>
      const lang = (localStorage.getItem('mmath.lang') || navigator.language || 'ru').toLowerCase().startsWith('ru') ? 'ru' : 'en';
      document.documentElement.lang = lang;
      for (const node of document.querySelectorAll('[data-ru]')) node.textContent = node.dataset[lang];
    </script>
  </body>
</html>
